name: Backtest code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile fetch_history.py backtest.py portfolio_backtest.py summarize_backtest.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Download real historical daily bars for diversified universe
        run: |
          mkdir -p data
          python fetch_history.py --codes-file research_universe.txt --start 20230101 --end 20261028 --adjust qfq --pause 0.8 --out data/daily_bars.csv
          python -c "import pandas as pd; d=pd.read_csv('data/daily_bars.csv'); n=d['code'].nunique(); print(f'Downloaded {n} stocks and {len(d)} bars'); assert n >= 20, f'Expected at least 20 stocks, got {n}'"

      - name: Run baseline, pullback, and trend-pullback comparison with time splits
        run: |
          python portfolio_backtest.py data/daily_bars.csv --strategy baseline --capital 1000000 --risk 0.0075 --stop 0.05 --target 0.08 --max-hold 5 --max-positions 5 --fee 0.0003 --out data/baseline_trades.csv --equity-out data/baseline_equity.csv
          python portfolio_backtest.py data/daily_bars.csv --strategy pullback --capital 1000000 --risk 0.0075 --stop 0.05 --target 0.08 --max-hold 5 --max-positions 5 --fee 0.0003 --out data/pullback_trades.csv --equity-out data/pullback_equity.csv
          python portfolio_backtest.py data/daily_bars.csv --strategy trend_pullback --capital 1000000 --risk 0.0075 --stop 0.05 --target 0.08 --max-hold 5 --max-positions 5 --fee 0.0003 --out data/trend_pullback_trades.csv --equity-out data/trend_pullback_equity.csv
          python summarize_backtest.py --data-dir data --out data/strategy_summary.csv
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-backtest-results
          path: data/*.csv
          if-no-files-found: warn
          retention-days: 14
