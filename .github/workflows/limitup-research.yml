name: A-share limit-up research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/limitup-research.yml"
      - "research_run.py"
      - "app.py"
      - "requirements.txt"
  schedule:
    - cron: "30 0 * * 1"
permissions:
  contents: write
concurrency:
  group: limitup-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run three-year research
        run: python research_run.py
      - name: Publish result files
        if: always()
        run: |
          mkdir -p docs/data
          cp research_data/output/run_report.json docs/data/ 2>/dev/null || true
          cp research_data/output/*.csv docs/data/ 2>/dev/null || true
          cp research_data/output/fatal_error.txt docs/data/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          echo "=== Research report ==="
          cat docs/data/run_report.json 2>/dev/null || true
          echo "=== Data source failure details (if any) ==="
          cat docs/data/fatal_error.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result files changed"
          else
            git commit -m "Update three-year limit-up research data"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; }
              if git push; then
                echo "Published research files successfully"
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after syncing main"
              sleep 3
            done
            echo "Could not publish research files after 5 attempts"
            exit 1
          fi
